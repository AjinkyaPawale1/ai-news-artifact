name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r apps/pipeline/requirements.txt

      - name: Test pipeline
        run: PYTHONPATH=apps/pipeline/src python -m unittest discover -s apps/pipeline/tests

      - name: Lint pipeline
        run: python -m ruff check apps/pipeline/src apps/pipeline/tests

      - name: Compile pipeline
        run: PYTHONPATH=apps/pipeline/src python -m compileall -q apps/pipeline/src apps/pipeline/tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build
